data:
  seed: 42
  languages:                       # short code -> NLLB code, fastText label, display info
    en: {nllb: eng_Latn, fasttext: en, name: English, rtl: false}
    fr: {nllb: fra_Latn, fasttext: fr, name: French,  rtl: false}
    ar: {nllb: arb_Arab, fasttext: ar, name: Arabic,  rtl: true}
    sw: {nllb: swh_Latn, fasttext: sw, name: Swahili, rtl: false}
  directions: [en-fr, fr-en, en-ar, ar-en, en-sw, sw-en]   # each one is trained AND evaluated

  # Each source lists the unordered pairs it can supply. Both directions are built
  # from every pair automatically (only those listed in `directions`).
  # VERIFY every Hub ID / config name once with: load_dataset(id, cfg).column_names
  sources:
    - name: opus-100
      hub_id: Helsinki-NLP/opus-100
      pairs: [en-fr, en-ar]
    - name: news-commentary
      hub_id: Helsinki-NLP/news_commentary
      pairs: [en-fr, en-ar]
    - name: nllb-en-sw-20k         # flat columns en/sw, single "default" config, 20k rows
      hub_id: ArmelRandy/nllb_en_sw_20K
      pairs: [en-sw]
      configs: {en-sw: default}
    - name: mafand-mt             # NEWS domain (train = Global Voices); ~30.8k rows; CC BY-NC 4.0
      data_file: https://raw.githubusercontent.com/masakhane-io/lafand-mt/main/data/json_files/en-swa/train.json
      pairs: [en-sw]
      column_codes: {sw: swa}
    - name: en-sw-processed        # VERIFY THE EXACT HUB ID before enabling (could not be found)
      hub_id: amaniopia/en-sw-processed
      pairs: [en-sw]
    # - name: tatoeba              # unverified: check config names and schema before enabling
    #   hub_id: Helsinki-NLP/tatoeba
    #   pairs: [en-fr, en-ar, en-sw]

  sizes:
    train_per_direction: 20000     # per DIRECTION after merging sources
    hpo_subset: 5000
    val_per_direction: 500
    pool_factor: 3

  cleaning:
    dedupe: true
    length_ratio: [0.5, 2.0]       # starting values, tune after inspecting dropped pairs
    min_tokens: 3
    max_tokens: 128
    drop_identical: true           # untranslated copies (source == target)
    drop_regex:                    # markup / URLs / template strings seen in the Swahili sources
      - 'https?://'
      - '\]\('
      - '<[^>]+>'
      - '\{\{|\}\}'
    langid:
      enabled: true
      model_path: lid.176.bin      # downloaded once if missing (needs internet)
      min_confidence: 0.5
      per_language: {sw: 0.2}      # Swahili: accept a "sw" label down to 0.2 (below that looks ungrammatical)
      reject_confidence: {sw: 0.7} # Swahili: only a CONFIDENT other language (>= 0.7) drops a row
      # starting values from two sources (~6 examples per band): re-check with scripts.inspect_langid

  tokenizer:
    max_length: 128

model:
  base: facebook/nllb-200-distilled-600M
  cache_dir: null
  max_length: 128

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]

training:
  output_dir: checkpoints          # relative -> under WORK_DIR (/kaggle/working on Kaggle)
  epochs: 2
  per_device_batch_size: 8
  grad_accum_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  fp16: true                       # set false if losses turn NaN
  gradient_checkpointing: false
  report_to: none
  seed: 42

generation:
  num_beams: 4
  max_new_tokens: 128

hpo:
  n_trials: 10
  max_steps_per_trial: 400
  study_name: machine_lingual_hpo
  storage_path: optuna/hpo.db
  space:
    learning_rate: {low: 5.0e-5, high: 1.0e-3, log: true}
    r: [8, 16, 32]
    alpha: [16, 32, 64]
    warmup_ratio: {low: 0.0, high: 0.1}

hub:
  repo_id: ${HF_USERNAME}/nllb-600M-lora
  private: false

eval:
  seed: 42
  output_dir: results              # relative -> under WORK_DIR
  baseline: baseline               # the system everything else is compared against
  systems:
    - {name: baseline,  base: facebook/nllb-200-distilled-600M}
    - {name: finetuned, base: facebook/nllb-200-distilled-600M, adapter: checkpoints/best_model}
    # - {name: nllb-1.3B, base: facebook/nllb-200-1.3B}      # optional extra zero-shot baseline
  test_set:                        # directions come from data.directions
    kind: per_language             # one Hub config per language, sentence in `text_column`
    hub_id: openlanguagedata/flores_plus   # UNVERIFIED and possibly gated: accept terms, set HF_TOKEN
    split: devtest
    text_column: text
    # kind: wide                   # one row per sentence, one column per language
    # hub_id: <dataset id>
    # columns: {en: sentence_eng_Latn, fr: sentence_fra_Latn, ar: sentence_arb_Arab, sw: sentence_swh_Latn}
    # kind: files                  # line-aligned local files, e.g. flores200_dataset/devtest/eng_Latn.devtest
    # path: /kaggle/input/flores200/devtest
    # file_pattern: "{nllb}.{split}"
  generation: {num_beams: 4, max_new_tokens: 128, batch_size: 32}
  chrf: {word_order: 2}
  bootstrap_resamples: 2000
  llm_judge: {enabled: false, samples_per_direction: 100}